name: Java CI & Web Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Swing Project
      run: |
        mkdir -p bin
        javac -cp "lib/*:src" -d bin $(find src -name "*.java")

    - name: Package Executable Distribution
      run: |
        zip -r BrickBreaker-Release.zip bin lib src build.bat run.bat README.md db.properties

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrickBreaker-Distribution
        path: BrickBreaker-Release.zip
