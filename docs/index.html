<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker - Classic Arcade Game</title>
    <meta name="description" content="Play Brick Breaker directly in your browser. Features multiple levels, power-ups, particle effects, high-score tracking, and retro synthesized audio.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Window Titlebar -->
        <div class="window-titlebar">
            <div class="window-title">
                <span class="icon">🧱</span> Brick Breaker
            </div>
            <div class="window-controls">
                <span class="control-btn minimize">―</span>
                <span class="control-btn maximize">□</span>
                <span class="control-btn close">✕</span>
            </div>
        </div>

        <!-- Main Header -->
        <header class="app-header">
            <h1 class="game-title">Brick Breaker</h1>
        </header>

        <!-- Main Game Body -->
        <div class="game-body">
            <!-- Game Canvas Area -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="680" height="540"></canvas>
            </div>

            <!-- Right Sidebar Panel -->
            <aside class="side-panel">
                <div class="control-group">
                    <label for="levelSelect" class="panel-label">Level</label>
                    <select id="levelSelect" class="styled-select">
                        <option value="1">Level 1 - Classic Rainbow</option>
                        <option value="2">Level 2 - Pyramid</option>
                        <option value="3">Level 3 - Checkerboard</option>
                        <option value="4">Level 4 - Armored Diamond</option>
                        <option value="5">Level 5 - Cosmic Chaos</option>
                    </select>
                </div>

                <div class="stats-card">
                    <div class="stat-row">
                        <span class="stat-title">Score</span>
                        <span id="scoreDisplay" class="stat-value">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-title">Lives</span>
                        <span id="livesDisplay" class="stat-value lives-val">3 ♥♥♥</span>
                    </div>
                </div>

                <div class="scores-card">
                    <h2 class="scores-title">Top Scores</h2>
                    <div class="table-container">
                        <table class="scores-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Score</th>
                                </tr>
                            </thead>
                            <tbody id="scoresTableBody">
                                <!-- Populated dynamically from storage -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Bottom Control Buttons -->
        <footer class="app-footer">
            <button id="startBtn" class="action-btn btn-primary">Start</button>
            <button id="pauseBtn" class="action-btn btn-secondary">Pause</button>
            <button id="saveScoreBtn" class="action-btn btn-info">Save Score</button>
            <button id="exitBtn" class="action-btn btn-danger">Exit</button>
            <button id="audioBtn" class="action-btn btn-audio">🔊 Audio: ON</button>
        </footer>
    </div>

    <!-- Save Score Modal Dialog -->
    <div id="saveModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 class="modal-title">Save Your High Score</h3>
            <p id="modalScoreSummary" class="modal-summary">Final Score: 0 | Level: 1</p>
            <div class="modal-field">
                <label for="playerNameInput">Player Name:</label>
                <input type="text" id="playerNameInput" maxlength="15" value="Player 1" placeholder="Enter name">
            </div>
            <div class="modal-actions">
                <button id="modalCancelBtn" class="action-btn btn-secondary">Cancel</button>
                <button id="modalSaveBtn" class="action-btn btn-primary">Save Score</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
